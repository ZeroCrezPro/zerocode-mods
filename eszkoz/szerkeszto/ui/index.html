<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZeroCode Szerkesztő</title>
    <link rel="icon" href="/images/../../favicon.svg" />
    <link rel="stylesheet" href="/ui/stilus.css" />
  </head>
  <body>
    <script>
      window.ZC_KULCS = '__KULCS__'
    </script>

    <header class="fejlec">
      <div class="marka">
        <span class="marka-jel" aria-hidden="true">Z</span>
        <span class="marka-szoveg">
          <span class="marka-fent">ZEROCODE</span>
          <span class="marka-lent">SZERKESZTŐ</span>
        </span>
      </div>

      <nav class="fo-nav" id="foNav" aria-label="Fő navigáció"></nav>

      <div class="fejlec-jobb">
        <span class="allapot" id="mentesAllapot" role="status" aria-live="polite">Betöltés…</span>
        <button type="button" class="gomb gomb-masodlagos" id="gombMentes">Mentés</button>
        <button type="button" class="gomb gomb-elsodleges" id="gombFrissites">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.6-6.4" />
            <path d="M21 4v5h-5" />
          </svg>
          Frissítés
        </button>
      </div>
    </header>

    <main id="tartalom" class="tartalom" tabindex="-1"></main>

    <!-- Publikálás ablak -->
    <div class="fatyol" id="publikalasAblak" hidden>
      <div class="parbeszed" role="dialog" aria-modal="true" aria-labelledby="publikalasCim">
        <div class="parbeszed-fej">
          <h2 id="publikalasCim">Frissítés</h2>
          <button type="button" class="gomb gomb-halvany" id="publikalasBezar">Bezárás</button>
        </div>
        <div class="parbeszed-test" id="publikalasTest"></div>
      </div>
    </div>

    <!-- Képválasztó ablak -->
    <div class="fatyol" id="kepAblak" hidden>
      <div class="parbeszed" role="dialog" aria-modal="true" aria-labelledby="kepCim">
        <div class="parbeszed-fej">
          <h2 id="kepCim">Kép választása</h2>
          <button type="button" class="gomb gomb-halvany" id="kepBezar">Bezárás</button>
        </div>
        <div class="parbeszed-test" id="kepTest"></div>
      </div>
    </div>

    <div class="pirit" id="pirit" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
