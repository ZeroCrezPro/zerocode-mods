      <stop offset="0" stop-color="#16161b"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <pattern id="diag" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="14" height="14" fill="none"/>
