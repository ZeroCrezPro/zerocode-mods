  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#diag)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="718" fill="none" stroke="#2a2a33" stroke-width="2"/>
  <rect x="0" y="714" width="486" height="6" fill="#d61f27"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="360" fill="#f2f2f4" font-size="80" font-weight="800" letter-spacing="1">BIZTONSÁGI MENTÉS</text>
    <text x="640" y="428" fill="#8b8b96" font-size="34" font-weight="700" letter-spacing="4">KÉPERNYŐKÉP</text>
