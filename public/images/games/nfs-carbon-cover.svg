<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="NFS CARBON">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161b"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <pattern id="diag" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="14" height="14" fill="none"/>
      <rect width="2" height="14" fill="#d61f27" opacity="0.16"/>
    </pattern>
    <radialGradient id="glow" cx="0.15" cy="0" r="0.9">
      <stop offset="0" stop-color="#d61f27" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#d61f27" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#diag)"/>
  <rect width="600" height="800" fill="url(#glow)"/>
  <rect x="1" y="1" width="598" height="798" fill="none" stroke="#2a2a33" stroke-width="2"/>
  <rect x="0" y="794" width="228" height="6" fill="#d61f27"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="300" y="400" fill="#f2f2f4" font-size="68" font-weight="800" letter-spacing="1">NFS CARBON</text>
    <text x="300" y="457.8" fill="#8b8b96" font-size="29" font-weight="700" letter-spacing="4">BORÍTÓ</text>
  </g>
</svg>
